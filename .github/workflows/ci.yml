name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Benchmark yra ATSKIRAS workspace paketas su savo tsconfig ir savo testais, tad
      # šaknies `pnpm test` jo nemato. Be atskiro žingsnio jis tyliai pūtų: paketas, kurio
      # niekas nepaleidžia, nustoja būti įrodymu ir tampa archyvu.
      - run: pnpm test:benchmark
      # BENCH-12: kiekvienas PR paleidžia offline smoke'ą. Jis NĖRA testų dublis — du iš penkių
      # jo tikrinimų prašo tinklinio režimo BE leidimo ir reikalauja atmetimo, tad regresija,
      # padariusi `--allow-network` neprivalomu, krenta čia, o ne pasirodo sąskaitoje. Vartas,
      # kurio kontraktas parašytas README, bet nepaleidžiamas CI, yra pažadas, ne vartas.
      - run: pnpm smoke:benchmark
      # Dashboard'as taip pat: savo tsconfig, savo vitest, savo testai. Be šio žingsnio
      # sulaužtas UI paaiškėtų tik operatoriui atsidarius naršyklę.
      - run: pnpm typecheck:ui
      - run: pnpm test:ui
      - run: pnpm build:ui
