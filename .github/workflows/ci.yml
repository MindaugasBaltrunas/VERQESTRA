name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Benchmark yra ATSKIRAS workspace paketas su savo tsconfig ir savo testais, tad
      # šaknies `pnpm test` jo nemato. Be atskiro žingsnio jis tyliai pūtų: paketas, kurio
      # niekas nepaleidžia, nustoja būti įrodymu ir tampa archyvu.
      - run: pnpm test:benchmark
      # BENCH-12: kiekvienas PR paleidžia offline smoke'ą. Jis NĖRA testų dublis — du iš penkių
      # jo tikrinimų prašo tinklinio režimo BE leidimo ir reikalauja atmetimo, tad regresija,
      # padariusi `--allow-network` neprivalomu, krenta čia, o ne pasirodo sąskaitoje. Vartas,
      # kurio kontraktas parašytas README, bet nepaleidžiamas CI, yra pažadas, ne vartas.
      - run: pnpm smoke:benchmark
      # Dashboard'as taip pat: savo tsconfig, savo vitest, savo testai. Be šio žingsnio
      # sulaužtas UI paaiškėtų tik operatoriui atsidarius naršyklę.
      - run: pnpm typecheck:ui
      - run: pnpm test:ui
      - run: pnpm build:ui
      # `mobile-gateway` — irgi atskiras workspace paketas su savo tsconfig ir savo testais, tad
      # šaknies `pnpm typecheck` jo nemato. Be šio žingsnio CI nepamatė, kad versijuotas kodas
      # importuoja failus, kurių repo'je NĖRA: `request-rate-limiter.ts` ir `worktree-lifecycle.ts`
      # kurį laiką egzistavo tik darbo medyje, tad švarus klonas nebūtų kompiliavęsis, o lokalus
      # typecheck buvo žalias vien dėl to, kad failai gulėjo diske. Būtent tai ir aprašo dvi
      # eilutės aukščiau: paketas, kurio niekas nepaleidžia, nustoja būti įrodymu.
      #
      # `mobile-app` ĮTRAUKTAS 2026-08-24: kai jį pridėjau, `mobile-app/src` buvo tuščias (`tsc`
      # grąžindavo TS18003), tad jo žingsnis būtų kritęs dėl nepastatyto paketo. Nuo tada paketas
      # gavo šaltinius, ir tą pastebėjo ne aš, o `mobile-app` vartas („the moment mobile-app has
      # sources, CI must run its suite too") — būtent tam jis ir buvo parašytas. Sąmoningas
      # praleidimas su sąlyga turi turėti sargą, kuris pastebi, kai sąlyga nustoja galioti.
      #
      # `mobile-app/native` ĮTRAUKTAS 2026-08-24 kartu su pačiu kiautu. Tai NUKRYPIMAS nuo
      # etalono, ir griežtinantis: ten `ci.yml` leido tik gateway ir MVA branduolį, o kiautas su
      # 30 testų nebuvo NĖ VIENAME varte — tai etalonas savo `verification-matrix.md` vardija
      # kaip žinomą spragą. Ji čia uždaroma, o ne paveldima: kiauto testai yra grynas Node
      # (jie skaito .tsx kaip TEKSTĄ ir nekrauna nei React, nei RN), tad CI jiems nereikia nei
      # įrenginio, nei emuliatoriaus. `typecheck:mobile-native` yra antra pusė: jis vienintelis
      # kompiliuoja pačius .tsx ekranus.
      - run: pnpm typecheck:mobile
      - run: pnpm test:mobile
      - run: pnpm typecheck:mobile-app
      - run: pnpm test:mobile-app
      - run: pnpm typecheck:mobile-native
      - run: pnpm test:mobile-native
