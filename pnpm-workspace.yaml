# VERQESTRA darbo sritys. Šaknies paketas (`verqestra`) yra pats orkestratorius; čia
# vardijami TIK atskiri paketai, kurie sąmoningai gyvena už jo ribų.
#
# `AG/benchmark` yra atskiras paketas ne dėl dydžio, o dėl krypties: matuojamas dalykas negali
# pasiekti to, kas jį matuoja. Benchmark'as orkestratorių varo kaip PROCESĄ per dokumentuotą
# CLI kontraktą (BENCH-1) ir niekada neimportuoja jo šaltinių — priešingu atveju jis liktų
# žalias net tada, kai sulūžtų realiai pristatoma komandinė eilutė.
packages:
  - AG/benchmark
  # Dashboard'as gyvena paketo ŠAKNYJE (`ui-app/dist`), nes būtent ten jo ieško `ui` komanda:
  # `composition/ui-command.ts` sprendžia `packageRoot()/ui-app/dist`. Kelias yra kontraktas,
  # o ne pasirinkimas — perkėlus jį kitur, dashboard'as tyliai virstų „API only" režimu.
  - ui-app
  # Mobile paketai (E9). Jie yra atskiri dėl RIBOS, ne dėl dydžio: `mobile-gateway` valdo
  # agento terminalo sesijas ir turi negalėti pasiekti orkestratoriaus šaltinių — AG Loop UI
  # jis mato tik per loopback HTTP projekciją. Sulieti juos į `src/` reikštų suteikti tą
  # teisę importu, t. y. panaikinti vienintelę ribą, kurią šis paketas apskritai turi.
  # `mobile-app` yra MVC (model/view/controller) kaip `ui-app`, be nė vienos priklausomybės;
  # `mobile-app/native` yra Expo/React Native kiautas, pasiekiantis branduolį TIK per jo barelį.
  - mobile-gateway
  - mobile-app
  - mobile-app/native

# pnpm blokuoja dependency build skriptus, kol jie nepatvirtinti. pnpm 11 senojo
# `onlyBuiltDependencies` sąrašo nebegerbia — sprendimai rašomi čia, po vieną paketą.
# `node-pty: true` yra OPERATORIAUS sprendimas (2026-08-23, E9 mobile migracija), o ne tylus
# install'o šalutinis efektas: be PTY `mobile-gateway` neturi kuo paleisti agento terminalo.
# `esbuild: false` — jo postinstall tik tikrina binarą; patį binarą pnpm atsineša per
# optionalDependencies (@esbuild/win32-x64), tad build skriptas nereikalingas.
allowBuilds:
  esbuild: false
  node-pty: true

# Task 134 (2026-09-01): worktree kopijose (`.ag/worktrees/**`) node_modules yra junction'as
# į pagrindinį medį (WORKTREE BOOTSTRAP), o pnpm 11 numatytoji verify-deps-before-run=install
# prieš KIEKVIENĄ `pnpm run` bando automatinį install, kuris atsisako svetimo modules katalogo
# (ERR_PNPM_UNSAFE_MODULES_DIR) — dėl to visos worktree patikros krisdavo exit 1 ir task'ai
# parkavosi human-review. `warn` palieka matomą signalą, kai node_modules atsilieka nuo
# lockfile (operatoriaus `pnpm install` lieka dokumentuotas žingsnis), bet nebeleidžia
# patikroms mirti aplinkos, o ne kodo, klaida. Deps galiojimą worktree'uose garantuoja
# bootstrap lockfile hash patikra.
verifyDepsBeforeRun: warn
